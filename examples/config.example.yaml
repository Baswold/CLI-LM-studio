# CLI-LM-Studio Example Configuration
# Copy this file to ~/.lm_studio/config.yaml and customize

# ============================================================================
# API Configuration
# ============================================================================

# URL of the LM Studio API server
# Default: http://localhost:1234
api_url: http://localhost:1234

# Request timeout in seconds
# Increase for slower models or longer responses
# Default: 30
api_timeout: 30

# ============================================================================
# Model Configuration
# ============================================================================

# Default model to use for completions
# Get available models with: lms models list
# Default: local-model
default_model: local-model

# Default system prompt
# This sets the behavior/personality of the assistant
# Default: You are a helpful AI assistant.
system_prompt: You are a helpful AI assistant.

# Sampling temperature (0.0 - 2.0)
# Lower = more deterministic, Higher = more creative
# - 0.0-0.3: Factual, deterministic (good for code, facts)
# - 0.4-0.7: Balanced (general use)
# - 0.8-1.2: Creative (creative writing)
# - 1.3-2.0: Very creative (experimental)
# Default: 0.7
temperature: 0.7

# Maximum tokens to generate in response
# Default: 2000
max_tokens: 2000

# Nucleus sampling parameter (0.0 - 1.0)
# Only tokens with cumulative probability <= top_p are considered
# Default: 0.9
top_p: 0.9

# ============================================================================
# History Configuration
# ============================================================================

# Enable conversation history tracking
# Default: true
history_enabled: true

# Path to store conversation history
# Default: ~/.lm_studio/history
history_path: ~/.lm_studio/history

# Maximum number of history entries to keep
# Older entries are automatically removed
# Default: 1000
history_max_entries: 1000

# ============================================================================
# Logging Configuration
# ============================================================================

# Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
# Default: INFO
log_level: INFO

# Optional: Path to log file
# If not specified, logs only go to console
# Uncomment to enable file logging
# log_file: ~/.lm_studio/logs/cli.log

# ============================================================================
# Display Configuration
# ============================================================================

# Enable colored output
# Default: true
color_enabled: true

# Enable markdown rendering in chat responses
# Default: true
markdown_enabled: true

